{% extends 'base.html' %}

{% block title %}{% if shoe %}Edit{% else %}New{% endif %} Shoe | Court District{% endblock %}

{% block content %}
<section class="section">
    <div class="panel form-shell">
        <h2>{% if shoe %}Edit shoe{% else %}Add a new shoe{% endif %}</h2>
        <form method="post">
            <div class="inline-grid">
                <div class="field">
                    <label for="name">Shoe name</label>
                    <input id="name" name="name" type="text" value="{{ shoe.name if shoe else '' }}" required>
                </div>
                <div class="field">
                    <label for="brand">Brand</label>
                    <input id="brand" name="brand" type="text" value="{{ shoe.brand if shoe else '' }}" required>
                </div>
            </div>
            <div class="inline-grid">
                <div class="field">
                    <label for="category">Category</label>
                    <input id="category" name="category" type="text" value="{{ shoe.category if shoe else '' }}" required>
                </div>
                <div class="field">
                    <label for="size_range">Size range</label>
                    <input id="size_range" name="size_range" type="text" value="{{ shoe.size_range if shoe else '' }}" required>
                </div>
            </div>
            <div class="inline-grid">
                <div class="field">
                    <label for="price">Price</label>
                    <input id="price" name="price" type="number" step="0.01" min="0.01" value="{{ '%.2f' | format(shoe.price_cents / 100) if shoe else '' }}" required>
                </div>
                <div class="field">
                    <label for="stock">Stock</label>
                    <input id="stock" name="stock" type="number" min="0" value="{{ shoe.stock if shoe else '' }}" required>
                </div>
            </div>
            <div class="field">
                <label for="image_url">Image URL</label>
                <input id="image_url" name="image_url" type="url" value="{{ shoe.image_url if shoe else '' }}" placeholder="https://example.com/shoe.jpg">
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description" required>{{ shoe.description if shoe else '' }}</textarea>
            </div>
            <button class="btn btn-primary" type="submit">{% if shoe %}Update shoe{% else %}Create shoe{% endif %}</button>
        </form>
    </div>
</section>
{% endblock %}
